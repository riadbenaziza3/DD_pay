services:
  db:
    image: postgres:18.6
    container_name: psp-db
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:5432:5432"   # only reachable from your own machine
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  migrations:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: psp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Apply migrations
        run: |
          docker run --rm --network host \
            -v "$PWD/db/migrations:/flyway/migrations" \
            flyway/flyway:13.10.0 \
            -url=jdbc:postgresql://localhost:5432/psp_test \
            -user=ci -password=ci \
            -locations=filesystem:/flyway/migrations \
            migrate
      - name: Run database tests
        run: |
          docker run --rm --network host \
            -v "$PWD/db/tests:/tests" \
            -e PGPASSWORD=ci \
            postgres:18.6 \
            psql -h localhost -U ci -d psp_test -f /tests/ledger_tests.sql
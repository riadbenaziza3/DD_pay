name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  migrations:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/wallet-service

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: wallet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run Java tests (applies migrations)
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: wallet_test
          DB_USER: ci
          DB_PASSWORD: ci
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Run database tests
        run: |
          docker run --rm --network host \
            -v "$PWD/db-tests:/tests" \
            -e PGPASSWORD=ci \
            postgres:18.6 \
            psql -h localhost -U ci -d wallet_test -f /tests/ledger_tests.sql

      - name: Build Docker image
        run: docker build -t wallet-service:ci .
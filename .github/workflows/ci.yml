name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  service:
    # One job per service, each shown as its own check on pull requests.
    # To add a service later, add its folder name to the list below.
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service: [account-service, customer-service]

    defaults:
      run:
        working-directory: services/${{ matrix.service }}

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run Java tests (applies migrations)
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: test_db
          DB_USER: ci
          DB_PASSWORD: ci
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Run database tests
        run: |
          for f in db-tests/*.sql; do
            echo "=== Running $f ==="
            docker run --rm --network host \
              -v "$PWD/db-tests:/tests" \
              -e PGPASSWORD=ci \
              postgres:18.6 \
              psql -h localhost -U ci -d test_db -f "/tests/$(basename "$f")"
          done

      - name: Build Docker image
        run: docker build -t ${{ matrix.service }}:ci .

  end-to-end:
    # Starts the whole platform (Keycloak, both services, both databases) exactly as on
    # a developer machine, then runs dev/e2e.ps1 against it. Only runs once every
    # service has passed its own checks above.
    name: end-to-end
    needs: service
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Create .env for the test platform
        # Throwaway values: this platform only lives for the duration of the job.
        run: |
          cat > .env <<'ENV'
          ACCOUNT_DB_NAME=account_db
          ACCOUNT_DB_USER=account_admin
          ACCOUNT_DB_PASSWORD=ci-account-password
          CUSTOMER_DB_NAME=customer_db
          CUSTOMER_DB_USER=customer_admin
          CUSTOMER_DB_PASSWORD=ci-customer-password
          KEYCLOAK_ADMIN_USER=admin
          KEYCLOAK_ADMIN_PASSWORD=ci-admin-password
          ACCOUNT_SYNC_CLIENT_SECRET=customer-service-dev-secret
          ENV

      - name: Start the platform
        run: docker compose up -d --build

      - name: Run the end-to-end scenario
        shell: pwsh
        run: ./dev/e2e.ps1 -StartupTimeoutSec 300

      - name: Show service logs
        if: failure()
        run: docker compose logs --no-color --tail=150 account-service customer-service keycloak

      - name: Stop the platform
        if: always()
        run: docker compose down -v

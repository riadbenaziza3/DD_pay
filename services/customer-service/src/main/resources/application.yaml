spring:
  application:
    name: customer-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:customer_db}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true          # errors come back as standard JSON (RFC 9457)
  security:
    oauth2:
      resourceserver:
        jwt:
          # Who must have issued the token (the "iss" claim). Checked on every request.
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/ddpay}
          # Where to fetch Keycloak's public keys. Inside Docker this is http://keycloak:8080/...,
          # which is why it is separate from the issuer.
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8180/realms/ddpay/protocol/openid-connect/certs}

management:
  endpoints:
    web:
      exposure:
        include: health

# Keeps each customer's account in account-service in line with their KYC/AML status.
account-sync:
  account-service-url: ${ACCOUNT_SERVICE_URL:http://localhost:8081}
  token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8180/realms/ddpay/protocol/openid-connect/token}
  client-id: ${ACCOUNT_SYNC_CLIENT_ID:customer-service}
  client-secret: ${ACCOUNT_SYNC_CLIENT_SECRET:}   # empty = sync switched off (e.g. in CI)
  poll-delay-ms: 2000          # how often queued syncs are processed
  reconcile-delay-ms: 300000   # safety net every 5 minutes (catches IDs expiring today)

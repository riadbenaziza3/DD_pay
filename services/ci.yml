name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  service:
    # One job per service, each shown as its own check on pull requests.
    # To add a service later, add its folder name to the list below.
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service: [wallet-service, customer-service]

    defaults:
      run:
        working-directory: services/${{ matrix.service }}

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run Java tests (applies migrations)
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: test_db
          DB_USER: ci
          DB_PASSWORD: ci
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Run database tests
        run: |
          for f in db-tests/*.sql; do
            echo "=== Running $f ==="
            docker run --rm --network host \
              -v "$PWD/db-tests:/tests" \
              -e PGPASSWORD=ci \
              postgres:18.6 \
              psql -h localhost -U ci -d test_db -f "/tests/$(basename "$f")"
          done

      - name: Build Docker image
        run: docker build -t ${{ matrix.service }}:ci .
